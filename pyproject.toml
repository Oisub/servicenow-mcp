[project]
name = "servicenow-mcp"
version = "0.1.0"
description = "ServiceNow MCP server for development, debugging and multi-instance environment setup"
license = "MIT"
authors = [{ name = "Dorian Shu" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
servicenow-mcp = "servicenow_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicenow_mcp"]
